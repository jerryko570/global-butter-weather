name: Slack PR Notification

# PR이 열리거나 리뷰 요청/머지/닫힐 때 Slack #pr-알림 채널로 알림을 보낸다.
# 사전 준비: 레포 Settings → Secrets and variables → Actions 에
#   SLACK_WEBHOOK_PR 시크릿(= #pr-알림 채널의 Incoming Webhook URL)을 등록해야 동작한다.
#   (배포 알림은 #배포-알림 채널용 SLACK_WEBHOOK_DEPLOY 시크릿을 별도로 쓴다.)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Compose and send Slack message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PR }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_PR 시크릿이 없어 알림을 건너뜁니다."
            exit 0
          fi

          case "$ACTION" in
            opened)            HEADER="🆕 새 PR" ;;
            reopened)          HEADER="🔁 PR 재오픈" ;;
            ready_for_review)  HEADER="👀 리뷰 대기" ;;
            review_requested)  HEADER="🙋 리뷰 요청 → @${REVIEWER}" ;;
            closed)
              if [ "$MERGED" = "true" ]; then HEADER="✅ PR 머지됨"; else HEADER="🚫 PR 닫힘"; fi ;;
            *)                 HEADER="PR 업데이트" ;;
          esac

          # PR 제목/작성자를 셸에 직접 넣지 않고 jq로 안전하게 JSON 구성 (인젝션 방지)
          TEXT="*${HEADER}*  <${PR_URL}|#${PR_NUMBER} ${PR_TITLE}>"$'\n'"📦 ${REPO} · 👤 ${PR_AUTHOR}"
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')

          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
